<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up</title>
    <link rel="stylesheet" href="/css_styles/style.css">
</head>
<body class = "cafe-theme">
    <div class="form-container">
        <h2 class="gold-text">Create a New Account</h2>
        <form action="/signup" method="POST">
            <input type="text" name="username" placeholder="Choose Username" required>
            <input type="password" name="new_password" placeholder="Password" required>
            <input type="password" name="confirm_password" placeholder="Confirm Password" required>
            <button type="submit" class="gold-button">Sign Up</button>
        </form>
        <p class="beige-text">Already have an account? <a href="/login" class="gold-link">Log in</a></p>
    </div>
</body>
</html>
