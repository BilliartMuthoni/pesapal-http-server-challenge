<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in</title>
    <link rel="stylesheet" href="/css_styles/style.css">
</head>
<body class="cafe-theme">
    <div class="form-container">
        <h2 class = "gold-text">Login to your Account</h2>
        <form action="/login" method="POST">
            <label class = "beige-text">Username:</label>
            <input type="text" name="username" required>

            <label class = "beige-text">Password:</label>
            <input type="password" name="password" required>
            <button type="submit">Login</button>
        </form>
        <p class="beige-text">New here? <a href="/signup" class="gold-link">Sign up</a></p>
    </div>
</body>
</html>
